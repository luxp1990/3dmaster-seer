name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-seer:
    name: Build Seer Full Plugin (Windows)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Download & Extract OCCT 8.0.0 & 3rdparty
        shell: pwsh
        run: |
          Write-Host "Downloading OpenCASCADE 8.0.0 combined package from GitHub..."
          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/occt-combined-release-pch.zip" -OutFile "occt-combined.zip"
          Write-Host "Downloading OpenCASCADE 8.0.0 3rdparty dependencies (TBB, jemalloc, freetype)..."
          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/3rdparty-vc14-64.zip" -OutFile "3rdparty.zip"
          
          Write-Host "Extracting outer OCCT archive..."
          Expand-Archive -Path "occt-combined.zip" -DestinationPath "temp_occt"
          $nestedZip = Get-ChildItem -Path "temp_occt" -Filter "*.zip" | Select-Object -First 1
          
          Write-Host "Extracting nested OCCT archive: $($nestedZip.FullName)..."
          Expand-Archive -Path $nestedZip.FullName -DestinationPath "occt"
          Remove-Item -Path "temp_occt", "occt-combined.zip" -Recurse -Force

          # If extracted into a subfolder like occt/opencascade-8.0.0-..., flatten to occt/
          if (-not (Test-Path "occt/inc")) {
            $foundInc = Get-ChildItem -Path "occt" -Recurse -Directory -Filter "inc" | Select-Object -First 1
            if ($foundInc) {
              $parentDir = $foundInc.Parent.FullName
              Write-Host "Flattening OCCT from $parentDir to occt/..."
              Get-ChildItem -Path $parentDir | ForEach-Object {
                Move-Item $_.FullName "occt/" -Force
              }
            }
          }

          Write-Host "Extracting 3rdparty dependencies..."
          Expand-Archive -Path "3rdparty.zip" -DestinationPath "temp_3rd"
          $nested3rd = Get-ChildItem -Path "temp_3rd" -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $nested3rd.FullName -DestinationPath "3rdparty"
          Remove-Item -Path "temp_3rd", "3rdparty.zip" -Recurse -Force

          Write-Host "Copying release-variant 3rdparty DLLs (tbb12, jemalloc, freetype...) into occt/win64/vc14/bin..."
          Get-ChildItem -Path "3rdparty" -Recurse -Filter "*.dll" | Where-Object {
            $segments = $_.DirectoryName -split '[/\\]'
            $inDebugDir = ($segments | Where-Object { $_ -ieq 'debug' }).Count -gt 0
            $isDebugNamed = $_.Name -imatch '(_debug|-debug)\.dll$' -or ($_.FullName -imatch '[/\\]qt5\.[^/\\]+[/\\]' -and $_.Name -cmatch 'd\.dll$')
            (-not $inDebugDir) -and (-not $isDebugNamed)
          } | ForEach-Object {
            Copy-Item $_.FullName "occt/win64/vc14/bin/" -Force
          }

          # Verify directories expected by CMake
          if (-not (Test-Path "occt/inc")) { throw "occt/inc directory missing after extraction!" }
          if (-not (Test-Path "occt/win64/vc14/lib")) { throw "occt/win64/vc14/lib directory missing after extraction!" }
          if (-not (Test-Path "occt/win64/vc14/bin")) { throw "occt/win64/vc14/bin directory missing after extraction!" }
          Write-Host "OCCT 8.0.0 & 3rdparty are verified and ready."

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S 3dmaster -G "Visual Studio 17 2022" -A x64

      - name: Build 3dmaster Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --target 3dmaster

      - name: Package Release
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at '$vswhere'. Cannot locate dumpbin.exe for dependency-closure packaging."
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath -or -not (Test-Path $vsPath)) {
            throw "Visual Studio VC++ Tools installation not found via vswhere.exe."
          }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Recurse -Filter "dumpbin.exe" |
            Where-Object { $_.FullName -match '[/\\]Hostx64[/\\]x64[/\\]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) {
            throw "dumpbin.exe (Hostx64/x64) not found under '$vsPath'."
          }
          Write-Host "Using dumpbin: $dumpbin"

          $distDir = "dist/3dmaster"
          if (Test-Path $distDir) { Remove-Item $distDir -Recurse -Force }
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          Write-Host "1. Copying 3dmaster core files..."
          Copy-Item "build/Release/3dmaster.dll" "$distDir/" -Force
          Copy-Item "3dmaster/plugin.json" "$distDir/" -Force
          if (Test-Path "3dmaster/3dmaster.ini") {
            Copy-Item "3dmaster/3dmaster.ini" "$distDir/" -Force
          } else {
            Set-Content -Path "$distDir/3dmaster.ini" -Value "[Navigation]`nPreset=0`n"
          }

          Write-Host "2. Computing transitive PE import closure from 3dmaster.dll..."
          $occtBin = "occt/win64/vc14/bin"
          if (-not (Test-Path $occtBin)) {
            throw "OCCT bin directory '$occtBin' does not exist."
          }

          $visited = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $rootBinary = (Resolve-Path "$distDir/3dmaster.dll").Path
          $queue.Enqueue($rootBinary)
          [void]$visited.Add("3dmaster.dll")

          $copiedCount = 0
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            $dumpOut = & $dumpbin /nologo /dependents $current
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /dependents failed for '$current' with exit code $LASTEXITCODE."
            }

            $inDepsSection = $false
            foreach ($line in $dumpOut) {
              if ($line -match 'Image has the following .*dependencies:') {
                $inDepsSection = $true
                continue
              }
              if ($inDepsSection -and $line -match '^\s*Summary\b') {
                $inDepsSection = $false
                continue
              }
              if ($inDepsSection -and $line -match '^\s*([^\s\\/:*?"<>|]+\.dll)\s*$') {
                $depName = $Matches[1]
                if ($visited.Add($depName)) {
                  $srcPath = Join-Path $occtBin $depName
                  if (Test-Path $srcPath) {
                    $dstPath = Join-Path $distDir $depName
                    Copy-Item $srcPath $dstPath -Force
                    $copiedCount++
                    $queue.Enqueue((Resolve-Path $dstPath).Path)
                  }
                }
              }
            }
          }
          Write-Host "Copied $copiedCount runtime DLLs in transitive closure."

          Write-Host "3. Running PE import table debug-CRT gate..."
          $forbiddenCrts = @("VCRUNTIME140D.dll", "MSVCP140D.dll", "ucrtbased.dll")
          $offenders = [System.Collections.Generic.List[string]]::new()
          $peFiles = Get-ChildItem -Path $distDir -Recurse -File | Where-Object { $_.Extension -in ".dll", ".exe" }
          foreach ($pe in $peFiles) {
            $importsOut = & $dumpbin /nologo /imports $pe.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /imports failed for '$($pe.FullName)' with exit code $LASTEXITCODE."
            }
            $badImports = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($line in $importsOut) {
              if ($line -match '^\s{4}([^\s\\/:*?"<>|]+\.dll)\s*$') {
                $impDll = $Matches[1]
                if ($forbiddenCrts -contains $impDll) {
                  [void]$badImports.Add($impDll)
                }
              }
            }
            if ($badImports.Count -gt 0) {
              $offenders.Add("$($pe.Name) -> $(($badImports | Sort-Object) -join ', ')")
            }
          }
          if ($offenders.Count -gt 0) {
            Write-Host "ERROR: Debug CRT dependencies detected in packaged binaries:"
            foreach ($offender in $offenders) {
              Write-Host "  - $offender"
            }
            exit 1
          }
          Write-Host "Debug-CRT gate passed: scanned $($peFiles.Count) PE binaries with 0 offenders."

          $tagLabel = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { 'dev' }
          $zipName = "3dmaster-seer-$tagLabel-windows-x64.zip"
          Write-Host "4. Compressing $zipName..."
          Compress-Archive -Path "$distDir/*" -DestinationPath $zipName -CompressionLevel Optimal
          $sizeMb = [math]::Round((Get-Item $zipName).Length / 1MB, 2)
          Write-Host "Packaged successfully: $zipName ($sizeMb MB)"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dmaster-seer-windows-x64
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) {
            throw "GITHUB_REF_NAME is empty; refusing to publish release without a real tag."
          }
          $notes = "### 3dmaster for Windows Seer (Full Edition with OpenCASCADE 8.0.0)`n`n" +
                   "Supported formats: STEP (.stp, .step), IGES (.igs, .iges), glTF (.gltf, .glb), 3MF, STL, OBJ, PLY, OFF, PRT.`n`n" +
                   "**Installation:**`n" +
                   "1. Download and extract ``$($env:ZIP_NAME)```n" +
                   "2. Copy all extracted files into your Seer plugin directory: ``C:\Program Files (x86)\Seer\plugins\3dmaster\```n" +
                   "3. Restart Seer."

          gh release create $tag $env:ZIP_NAME --title "3dmaster-seer $tag (Full OCCT Edition)" --notes "$notes"
